<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 同声传译助手</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-content">
      <h1 class="title">🎙️ AI 同声传译助手</h1>
      <div class="status-bar">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusText">未连接</span>
      </div>
    </div>
  </header>

  <!-- 主操作区 -->
  <main class="main-container">
    <!-- 控制面板 -->
    <section class="control-panel">
      <button class="btn btn-record" id="btnRecord" disabled>
        <span class="btn-icon">🎤</span>
        <span class="btn-text">开始录音</span>
      </button>

      <div class="language-selector">
        <div class="lang-group">
          <label for="sourceLang">源语言</label>
          <select id="sourceLang">
            <option value="en">英语</option>
            <option value="zh">中文</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
          </select>
        </div>
        <span class="lang-arrow">→</span>
        <div class="lang-group">
          <label for="targetLang">目标语言</label>
          <select id="targetLang">
            <option value="zh" selected>中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
          </select>
        </div>
      </div>

      <div class="control-actions">
        <button class="btn btn-secondary" id="btnReset">🔄 重置</button>
        <button class="btn btn-secondary" id="btnClear">🗑️ 清空字幕</button>
      </div>
    </section>

    <!-- 字幕显示区 -->
    <section class="subtitle-area">
      <!-- 原文显示 -->
      <div class="subtitle-panel original-panel">
        <div class="panel-header">
          <h3>🔊 源语言识别</h3>
          <span class="panel-badge" id="sttBadge">等待输入...</span>
        </div>
        <div class="subtitle-content" id="originalContent">
          <div class="placeholder-text">等待语音输入...</div>
        </div>
      </div>

      <!-- 翻译结果 -->
      <div class="subtitle-panel translation-panel">
        <div class="panel-header">
          <h3>🌐 实时翻译</h3>
          <span class="panel-badge" id="transBadge">等待翻译...</span>
        </div>
        <div class="subtitle-content" id="translationContent">
          <div class="placeholder-text">等待翻译结果...</div>
        </div>
      </div>

      <!-- 修正通知区 -->
      <div class="correction-panel" id="correctionPanel" style="display:none;">
        <div class="panel-header">
          <h3>🔄 修正</h3>
        </div>
        <div class="correction-list" id="correctionList"></div>
      </div>
    </section>

    <!-- 音频可视化 -->
    <section class="visualizer-section">
      <canvas id="audioVisualizer" width="800" height="60"></canvas>
    </section>
  </main>

  <!-- 连接配置弹窗 -->
  <div class="modal-overlay" id="connectModal">
    <div class="modal">
      <h2>🔌 连接到服务</h2>
      <p>请确保后端服务已启动，配置 API Key 后可开始使用。</p>
      <div class="form-group">
        <label for="serverUrl">服务器地址</label>
        <input type="text" id="serverUrl" value="ws://localhost:3000" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnConnect">连接</button>
      </div>
      <p class="hint">提示: 先运行 <code>npm start</code> 启动后端</p>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="/js/audio.js"></script>
  <script src="/js/subtitles.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
